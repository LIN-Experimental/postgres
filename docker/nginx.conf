# Proxy TCP de LIN delante de PostgreSQL.
#
# Escucha en 5432, valida la IP del cliente contra la API de LIN y, si la
# acepta, reenvía la conexión a PostgreSQL en 127.0.0.1:5433. La validación
# ocurre antes de leer un solo byte del protocolo, así que el TLS (SSLRequest)
# sigue siendo de extremo a extremo hasta PostgreSQL.
#
# Es el mismo mecanismo que usa la imagen linplatform/mysql en su puerto 3306.

worker_processes 1;
error_log /dev/stderr notice;
pid /var/run/openresty/nginx.pid;

# nginx limpia el entorno de los workers: lo que Lua lea con os.getenv se declara aquí
env RESOURCE;
env LIN_IP_VALIDATION_URL;

events {
    worker_connections 1024;
}

stream {
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    server {
        listen 5432;

        preread_by_lua_block {
            local http = require "resty.http"
            local httpc = http.new()

            -- Timeouts (connect, send, read) en ms
            httpc:set_timeouts(5000, 5000, 5000)

            -- El entrypoint garantiza que RESOURCE es un entero (se concatena tal cual en el JSON)
            local resource_id = os.getenv("RESOURCE") or "0"
            local url = os.getenv("LIN_IP_VALIDATION_URL")
            if not url or url == "" then
                url = "https://api.linplatform.com/developer/resources/validations/eval"
            end

            -- Sin proxy delante de este, remote_addr es la IP real del cliente
            local client_ip = ngx.var.remote_addr
            ngx.log(ngx.INFO, "Validando IP: ", client_ip, " para recurso: ", resource_id)

            local res, err = httpc:request_uri(url, {
                method = "POST",
                body = '{"ip":"' .. client_ip .. '", "resource":' .. resource_id .. '}',
                headers = {
                    ["Content-Type"] = "application/json",
                },
                ssl_verify = true
            })

            if not res then
                ngx.log(ngx.ERR, "Error contactando API: ", err)
                return ngx.exit(ngx.ERROR)
            end

            if res.status ~= 200 then
                ngx.log(ngx.WARN, "Acceso denegado para IP: ", client_ip, " Status: ", res.status)
                return ngx.exit(ngx.ERROR)
            end

            ngx.log(ngx.NOTICE, "Acceso concedido para IP: ", client_ip)
        }

        proxy_pass 127.0.0.1:5433;
    }
}
