name: Publish image

on:
  push:
    branches: [master]
    paths-ignore:
      - doc/**
      - "**.md"
      - .github/workflows/pg-ci.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - src/**
      - contrib/**
      - config/**
      - configure
      - configure.ac
  schedule:
    # Lunes 05:00 UTC: reconstruye para recoger parches de debian:bookworm-slim
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  IMAGE: linplatform/postgres

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo se publica fuera de PR (push a master, cron o manual); los PR solo construyen.
      - name: Login a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build (y push si aplica)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
